# CI — gate duro (GUIA_DESARROLLO §8). El merge se bloquea si falla.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: black (formato)
        run: black --check --diff src/ tests/
      - name: flake8 (lint)
        run: flake8 src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: pytest + cobertura
        run: pytest --cov --cov-report=term-missing

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: mypy (informativo hasta v1.4.0, ver ROADMAP.md / #20)
        # Paso no-bloqueante: el código aún no está tipado por completo. Los
        # hallazgos de mypy quedan en los logs sin marcar el check en rojo.
        continue-on-error: true
        run: mypy
