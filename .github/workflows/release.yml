# Release — dispara con tags v* (GUIA_DESARROLLO §9).
# Proyecto Python puro: publica sdist+wheel en el GitHub Release (sin GHCR).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a (re)publicar, ej. v1.2.3"
        required: true

permissions:
  contents: write   # crear el GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Validar tag == VERSION == CHANGELOG
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          [ "$VER" = "$FILE_VER" ] || { echo "::error::tag $TAG != VERSION $FILE_VER"; exit 1; }
          grep -q "^## \[$VER\]" CHANGELOG.md || { echo "::error::falta sección [$VER] en CHANGELOG.md"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verificar artefactos
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Instalar y probar el wheel publicable
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -c "import mender_simulator; print('wheel OK:', mender_simulator.__version__)"
          python -m mender_simulator --help

  create-release:
    needs: [validate-version, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extraer notas del CHANGELOG
        run: |
          VER="${{ needs.validate-version.outputs.version }}"
          awk "/^## \[$VER\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "::error::notas vacías para $VER"; exit 1; }
      - name: Crear GitHub Release (idempotente)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          name: v${{ needs.validate-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
