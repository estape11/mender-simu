# Mender Fleet Simulator Configuration

server:
  # If url or tenant_token are left empty, values are read from /etc/mender/mender.conf
  url: ""
  tenant_token: ""
  poll_interval: 60  # seconds between deployment checks
  # Personal Access Token for management API (preauthorization).
  # Create one in Mender UI → Settings → Access Tokens.
  # Leave empty to skip preauthorization (devices require manual acceptance).
  personal_access_token: ""

simulator:
  success_rate: 0.8  # 80% success rate for updates
  log_file: "simulator.log"
  log_level: "INFO"
  database_path: "devices.db"

# Industry profiles with device groups
industries:
  automotive:
    enabled: true
    preauth: true  # Preauthorize devices on the Mender server
    count: 1
    bandwidth_kbps: 500  # Virtual bandwidth in KB/s
    id_prefix: "VIN"
    id_format: "VIN-{manufacturer}{year}{serial}"
    manufacturers: ["WVWZZZ", "3VWDP7", "1HGBH4", "5YJSA1"]
    inventory:
      device_type: "tcu-4g-lte"
      artifact_name: "v2024.1.0"
      kernel_version: "5.15.0-automotive"
      firmware_version: "ECU-3.2.1"
      oem_variant: ["standard", "premium", "sport"]

  smart_buildings:
    enabled: true
    preauth: true
    count: 1
    bandwidth_kbps: 1000
    id_prefix: "MAC"
    id_format: "MAC-{oui}:{device_id}"
    oui_prefixes: ["00:1A:2B", "DC:A6:32", "B8:27:EB", "E4:5F:01"]
    inventory:
      device_type: "bms-controller-hvac"
      artifact_name: "v1.8.0"
      kernel_version: "5.10.0-rpi"
      firmware_version: "BMS-2.1.0"
      zone_types: ["hvac", "lighting", "security", "elevator"]

  medical:
    enabled: true
    preauth: true
    count: 1
    bandwidth_kbps: 2000
    id_prefix: "FDA"
    id_format: "FDA-{device_class}{serial}"
    device_classes: ["II", "III"]
    inventory:
      device_type: "patient-monitor-icu"
      artifact_name: "v5.0.0-validated"
      kernel_version: "5.4.0-medical-lts"
      firmware_version: "MED-5.0.0"
      compliance: ["FDA-510k", "CE-MDR", "IEC-62304"]

  industrial_iot:
    enabled: true
    preauth: true
    count: 1
    bandwidth_kbps: 250
    id_prefix: "IND"
    id_format: "IND-{plant}{line}{unit}"
    plants: ["PLANT-A", "PLANT-B", "PLANT-C"]
    inventory:
      device_type: "plc-gateway-modbus"
      artifact_name: "v3.5.0"
      kernel_version: "4.19.0-industrial"
      firmware_version: "IIoT-3.5.0"
      protocols: ["modbus", "opcua", "mqtt", "profinet"]

  retail:
    enabled: true
    preauth: false
    count: 1
    bandwidth_kbps: 800
    id_prefix: "POS"
    id_format: "POS-{region}{store}{terminal}"
    regions: ["NA", "EU", "APAC", "LATAM"]
    inventory:
      device_type: "pos-terminal-emv"
      artifact_name: "v2.0.0"
      kernel_version: "5.15.0-retail"
      firmware_version: "POS-2.0.0"
      payment_modules: ["chip", "nfc", "magstripe"]

  ev_charging:
    enabled: true
    preauth: true
    count: 1
    bandwidth_kbps: 1000
    id_prefix: "EVC"
    id_format: "EVC-{network}-{station}-{port}"
    networks: ["NET-WEST", "NET-EAST", "NET-CENTRAL"]
    inventory:
      device_type: "ev-charger-ocpp-2.0"
      artifact_name: "v1.2.0"
      kernel_version: "5.15.0-ev"
      firmware_version: "EVC-1.2.0"
      charger_types: ["ac-level2-7kW", "dc-fast-50kW"]
      protocols: ["ocpp-2.0.1"]
      connector_types: ["ccs2", "type2"]

  # UAS fleet demo (OTA UAS fleet management animations):
  # airframes converge on flight-os via a dynamic group (device_type = quad-x).
  uas_airframe:
    enabled: true
    preauth: true
    count: 1
    bandwidth_kbps: 400  # mix of wired / tactical LTE / SATCOM links
    id_prefix: "UAS"
    id_format: "UAS-{tail_number}"
    tail_number_start: 140  # tail numbers: UAS-0140, UAS-0141, ...
    os_name: "flight-os"
    os_versions: ["2.1", "2.2", "2.3"]  # mixed fleet; factory image is 1.6
    inventory:
      device_type: "quad-x"
      artifact_name: "2.3"  # placeholder; overridden per device from os_versions
      kernel_version: "6.1.0-uas-rt"
      firmware_version: "FC-4.2"
      system_type: "uas-mk2"

  # Ground control stations: a small static group updated with gcs-os.
  uas_gcs:
    enabled: true
    preauth: true
    count: 1
    bandwidth_kbps: 5000
    id_prefix: "GCS"
    id_format: "GCS-{station_id}"
    os_name: "gcs-os"
    os_versions: ["4.8", "4.9", "5.0"]
    inventory:
      device_type: "gcs"
      artifact_name: "5.0"  # placeholder; overridden per device from os_versions
      kernel_version: "6.1.0-gcs"
      firmware_version: "GCS-5.0"

  # Orchestrator demo A: systems genericos (ver docs/orchestrator-simulation.md).
  # tier: system -> el device autentica como System, reporta componentes y
  # procesa deployments de Manifests. Requiere plan enterprise con
  # max_system_devices > 0.
  system_core:
    enabled: false
    preauth: true
    count: 1
    bandwidth_kbps: 2000
    tier: "system"
    system_type: "system-core"
    id_prefix: "SYS"
    id_format: "SYS-{system_id}"
    site_number_start: 1
    inventory:
      device_type: "gateway"
      artifact_name: "system-core-v1"   # manifest instalado (nombre verbatim)
      kernel_version: "6.1.0-gw"
    components:
      - component_type: "gateway"
        id_format: "GW-{site_id}"
        count: 1
        initial_version: "gateway-v1"
        system_component: true   # host del orchestrator (requerido >= 1.0.0)
      - component_type: "rtos"
        id_format: "R-{site_id}-{n}"
        count: 2
        initial_version: "rtos-v1"

  # Orchestrator demo B: sitios de monitoreo de lineas de transmision
  # (industria electrica de potencia). Un system por sitio: gateway + sensores + meteo.
  grid_site:
    enabled: false
    preauth: true
    count: 1
    bandwidth_kbps: 800
    tier: "system"
    system_type: "grid-monitoring-site"
    id_prefix: "GRID"
    id_format: "GRID-SITE-{site_id}"
    site_number_start: 401
    line_ids: ["TL-115kV-North", "TL-230kV-East"]
    inventory:
      device_type: "grid-gateway"
      artifact_name: "grid-site-v1"       # manifest instalado (nombre verbatim)
      kernel_version: "6.1.0-grid"
    components:
      - component_type: "edge-gateway"
        id_format: "GW-{site_id}"
        count: 1
        initial_version: "gridgw-v1"
        system_component: true   # host del orchestrator (requerido >= 1.0.0)
      - component_type: "line-sensor"
        id_format: "LS-{site_id}-{n}"
        count: 3
        initial_version: "lsensor-fw-v1"
      - component_type: "weather-station"
        id_format: "WX-{site_id}"
        count: 1
        initial_version: "wx-fw-v1"

  # Orchestrator use case: vehiculo electrico definido por software.
  # El vehiculo es un System (identidad por VIN); un manifest actualiza
  # VCU + BMS + inversores + ADAS como conjunto coherente.
  ev_vehicle:
    enabled: false
    preauth: true
    count: 1
    bandwidth_kbps: 3000
    tier: "system"
    system_type: "ev-platform"
    id_prefix: "EV"
    id_format: "EV-{vin}"
    site_number_start: 1
    manufacturers: ["5YJEV1", "WVWEV2"]
    platform_revs: ["rev-b", "rev-c"]
    inventory:
      device_type: "vcu"
      artifact_name: "ev-platform-v1"   # manifest instalado (nombre verbatim)
      kernel_version: "6.1.0-vcu-rt"
    components:
      - component_type: "vcu"
        id_format: "VCU-{site_id}"
        count: 1
        initial_version: "vcu-os-v1"
        system_component: true   # computo central, host del orchestrator
      - component_type: "bms"
        id_format: "BMS-{site_id}"
        count: 1
        initial_version: "bms-fw-v1"
      - component_type: "inverter"
        id_format: "INV-{site_id}-{n}"
        count: 2
        initial_version: "inv-fw-v1"
      - component_type: "adas"
        id_format: "ADAS-{site_id}"
        count: 1
        initial_version: "adas-fw-v1"

  # Orchestrator use case: hub de carga EV (el sitio completo como System,
  # complementa la industria ev_charging de cargadores standalone).
  charging_hub:
    enabled: false
    preauth: true
    count: 1
    bandwidth_kbps: 2000
    tier: "system"
    system_type: "ev-charging-hub"
    id_prefix: "HUB"
    id_format: "HUB-{hub_id}"
    site_number_start: 1
    inventory:
      device_type: "hub-controller"
      artifact_name: "ev-charging-hub-v1"   # manifest instalado
      kernel_version: "6.1.0-hub"
    components:
      - component_type: "site-controller"
        id_format: "SC-{site_id}"
        count: 1
        initial_version: "hubctl-v1"
        system_component: true
      - component_type: "charge-point"
        id_format: "CP-{site_id}-{n}"
        count: 4
        initial_version: "cp-fw-v1"
      - component_type: "power-cabinet"
        id_format: "PWR-{site_id}"
        count: 1
        initial_version: "pwr-fw-v1"

# Simulated error messages for failed updates
error_messages:
  - "Kernel panic: VFS: Unable to mount root fs on unknown-block(0,0)"
  - "Checksum mismatch: expected {expected}, got {actual}"
  - "Out of memory during artifact extraction"
  - "Flash write failed: sector 0x{sector} write error"
  - "Signature verification failed: invalid RSA signature"
  - "Timeout waiting for rootfs switch"
  - "Bootloader update failed: version mismatch"
  - "Rollback triggered: health check failed after 3 attempts"
  - "Disk space insufficient: required 512MB, available 128MB"
  - "Network timeout during artifact download at {percentage}%"
